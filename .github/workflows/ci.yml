name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formato
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Tests con detector de carreras
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Validar reglas
        run: go run ./cmd/bastion rules lint
      - name: Compilar
        run: go build -o bin/ ./cmd/bastion
      # Escaneo real en el runner: prueba todos los probes contra un
      # Ubuntu y un Windows Server reales.
      - name: Escaneo real (Linux)
        if: runner.os == 'Linux'
        run: sudo ./bin/bastion scan --all -o report.html -o report.json
      - name: Escaneo real (Windows)
        if: runner.os == 'Windows'
        run: .\bin\bastion.exe scan --all -o report.html -o report.json
      # Superficie de ataque en un sistema real (en Windows ejercita netstat,
      # tasklist y las consultas PowerShell de recursos y administradores).
      - name: Superficie de ataque (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo ./bin/bastion surface --all --no-color
          sudo ./bin/bastion surface --format json | jq -e '.schema == "bastion.surface/v1" and (.listeners | length) > 0 and (.ports | length) > 0 and (.admins | length) > 0'
      - name: Superficie de ataque (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\bin\bastion.exe surface --all --no-color
          if ($LASTEXITCODE -ne 0) { throw 'surface falló' }
          $r = .\bin\bastion.exe surface --format json | ConvertFrom-Json
          if ($r.listeners.Count -eq 0) { throw 'no se detectó ningún puerto a la escucha' }
          if ($r.admins.Count -eq 0) { throw 'no se leyeron los administradores' }
          if (-not ($r.listeners | Where-Object { $_.process })) { throw 'ningún puerto asociado a su proceso' }
          if (-not $r.firewall -or $r.firewall.profiles.Count -ne 3) { throw 'no se evaluó el Firewall de Windows' }
          # Como administrador, las reglas salen completas del registro.
          if ($r.firewall.source -ne 'registry' -or $r.firewall.inbound_rules -eq 0) { throw "reglas del firewall no leídas del registro (origen: $($r.firewall.source))" }
          "Servicios en la red: $($r.exposed) · accesibles a través del firewall: $($r.reachable) · reglas de entrada: $($r.firewall.inbound_rules) ($($r.firewall.source))"
      # Una excepción saca el control de la puntuación y al quitarla vuelve.
      - name: Excepciones (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          b=./bin/bastion
          id=$(sudo $b scan --format json | jq -r '[.results[] | select(.status=="fail")][0].rule.id')
          sudo $b exceptions add "$id" --reason "Prueba de CI: riesgo aceptado temporalmente" --expires 7d --no-color
          sudo $b exceptions list --no-color
          test "$(sudo $b scan --format json | jq '.score.exceptions')" -eq 1
          sudo $b exceptions remove "$id" --no-color
          test "$(sudo $b scan --format json | jq '.score.exceptions')" -eq 0
      # Consola local: sin token no hay datos, Host ajeno rechazado, y con
      # token escanea y calcula el plan.
      - name: Consola local (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo ./bin/bastion ui --no-open --port 8790 --no-color > ui.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do grep -q '?t=' ui.log && break; sleep 0.5; done
          tok=$(grep -o '?t=[A-Za-z0-9_-]*' ui.log | head -1 | cut -c4-)
          base=http://127.0.0.1:8790
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' $base/)" = 403
          curl -sf -H "X-Bastion-Token: $tok" $base/api/state | jq -e '.hostname'
          curl -sf -X POST -H "X-Bastion-Token: $tok" $base/api/scan | jq -e '.report.score.value >= 0'
          curl -sf -H "X-Bastion-Token: $tok" "$base/api/plan?wave=1" | jq -e 'length > 0'
          curl -sf -H "X-Bastion-Token: $tok" $base/api/reports | jq -e 'length >= 1'
          sudo kill "$pid" || true
      # Ciclo completo de hardening en la máquina desechable del runner:
      # aplicar la ola 1 debe mejorar la postura y el rollback debe dejarla
      # exactamente como estaba.
      - name: Ciclo harden → rollback (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          b=./bin/bastion
          before=$(sudo $b scan --format json | jq .score.value)
          sudo $b harden --wave 1 --no-color
          sudo $b harden --wave 1 --apply --yes --no-color
          after=$(sudo $b scan --format json | jq .score.value)
          sudo $b history --no-color
          sudo $b rollback --yes --no-color
          restored=$(sudo $b scan --format json | jq .score.value)
          echo "Postura: $before → $after → $restored"
          test "$after" -gt "$before"
          test "$restored" -eq "$before"
      - name: Ciclo harden → rollback (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $b = '.\bin\bastion.exe'
          $before = (& $b scan --format json | ConvertFrom-Json).score.value
          & $b harden --wave 1 --no-color
          & $b harden --wave 1 --apply --yes --no-color
          if ($LASTEXITCODE -ne 0) { throw 'harden falló' }
          $after = (& $b scan --format json | ConvertFrom-Json).score.value
          & $b history --no-color
          & $b rollback --yes --no-color
          if ($LASTEXITCODE -ne 0) { throw 'rollback falló' }
          $restored = (& $b scan --format json | ConvertFrom-Json).score.value
          "Postura: $before -> $after -> $restored"
          if ($after -le $before) { throw 'harden no mejoró la postura' }
          if ($restored -ne $before) { throw "rollback no restauró la postura ($restored distinto de $before)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-${{ matrix.os }}
          path: report.*

  scripts:
    name: Instaladores
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $r = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh

  cross:
    name: Compilación cruzada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/bastion
            echo "ok $target"
          done
