name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write      # firmar la procedencia con la identidad OIDC del workflow (Sigstore)
  attestations: write  # publicar las atestaciones en el repositorio

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: version.txt para los instaladores
        run: mkdir -p .release && echo "${GITHUB_REF_NAME}" > .release/version.txt
      - name: Instalar Syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Procedencia SLSA de cada archivo publicado: prueba que lo construyó
      # este workflow a partir de esta etiqueta del repositorio. Se comprueba
      # con «gh attestation verify <archivo> --repo Ruby570bocadito/bastion».
      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
