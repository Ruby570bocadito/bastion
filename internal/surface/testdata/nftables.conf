flush ruleset
table inet filter {
	set admin_nets {
		type ipv4_addr
		flags interval
		elements = { 10.8.0.0/24, 192.168.50.0/24 }
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept
		tcp dport 22 accept
		tcp dport { 80, 443 } accept comment "web"
		ip saddr @admin_nets tcp dport 9100 accept
		iifname "wg0" tcp dport 5432 accept
		udp dport 51820 accept
		tcp dport 8000-8010 ip saddr 192.168.1.0/24 accept
		tcp dport 25 drop
		meta mark 0x00000001 tcp dport 6379 accept
		jump services
		counter drop
	}
	chain services {
		tcp dport 3000 ip6 saddr fd00::/8 accept
		udp dport 53 accept
		return
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
