id: WIN-AUD-002
title: Línea de comandos en los eventos de creación de procesos
description: El evento 4688 debe incluir la línea de comandos completa.
rationale: Sin la línea de comandos, el evento 4688 apenas sirve para detectar PowerShell codificado, LOLBins o movimiento lateral.
category: Auditoría y registro
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AU-3]
  mitre_mitigations: [M1047]
  mitre_techniques: [T1059]
check:
  probe: registry
  path: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
  name: ProcessCreationIncludeCmdLine_Enabled
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Include command line in process creation events".
  gpo: Computer Configuration > Administrative Templates > System > Audit Process Creation > Include command line in process creation events
  breaking_risk: none
---
id: WIN-AUD-010
title: La auditoría avanzada prevalece sobre la clásica
description: SCENoApplyLegacyAuditPolicy debe ser 1 para que las subcategorías no sean sobrescritas por la directiva clásica.
rationale: Sin este ajuste, una directiva de auditoría clásica puede anular la configuración avanzada sin que nadie lo note.
category: Auditoría y registro
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AU-2]
  mitre_mitigations: [M1047]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\Lsa
  name: SCENoApplyLegacyAuditPolicy
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Audit - Force audit policy subcategory settings to override audit policy category settings".
  breaking_risk: none
---
id: WIN-AUD-011
title: Registro de Seguridad de 192 MB o más
description: El tamaño máximo del registro de Seguridad debe ser de al menos 196.608 KB.
rationale: Con el tamaño por defecto (20 MB) los eventos se sobrescriben en horas y se pierde la evidencia.
category: Auditoría y registro
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AU-4, AU-11]
  mitre_techniques: [T1070.001]
check:
  any:
    - {label: directiva (KB), probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security, name: MaxSize, op: gte, expected: 196608}
    - {label: servicio (bytes), probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Security, name: MaxSize, op: gte, expected: 201326592, default: 20971520}
remediation:
  summary: Aumentar el tamaño del registro de Seguridad (y reenviar los eventos a un SIEM).
  commands: wevtutil sl Security /ms:201326592
  breaking_risk: none
---
id: WIN-PS-001
title: Registro de bloques de script de PowerShell
description: Script Block Logging debe estar activado.
rationale: Registra el código PowerShell real que se ejecuta, incluso ofuscado o en memoria (evento 4104).
category: PowerShell
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AU-2, AU-12]
  mitre_mitigations: [M1047]
  mitre_techniques: [T1059.001]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
  name: EnableScriptBlockLogging
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Turn on PowerShell Script Block Logging".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Windows PowerShell > Turn on PowerShell Script Block Logging
  breaking_risk: none
---
id: WIN-PS-002
title: PowerShell 2.0 eliminado
description: Las características MicrosoftWindowsPowerShellV2Root y MicrosoftWindowsPowerShellV2 no deben estar habilitadas.
rationale: Los atacantes fuerzan PowerShell 2.0 para saltarse AMSI y el registro de scripts.
category: PowerShell
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [CM-7]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1059.001, T1562.001]
check:
  all:
    - {label: V2Root, probe: ps, query: optional_features, field: MicrosoftWindowsPowerShellV2Root, op: in, expected: [Disabled, DisabledWithPayloadRemoved], on_missing: pass}
    - {label: V2, probe: ps, query: optional_features, field: MicrosoftWindowsPowerShellV2, op: in, expected: [Disabled, DisabledWithPayloadRemoved], on_missing: pass}
remediation:
  summary: Deshabilitar PowerShell 2.0.
  commands: Disable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -NoRestart
  breaking_risk: low
---
id: WIN-PS-003
title: Registro de módulos de PowerShell
description: Module Logging debe estar activado.
rationale: Registra la ejecución de cmdlets y sus parámetros (evento 4103).
category: PowerShell
severity: medium
platforms: [windows]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [AU-12]
  mitre_mitigations: [M1047]
  mitre_techniques: [T1059.001]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging
  name: EnableModuleLogging
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Turn on Module Logging" con el módulo "*".
  breaking_risk: none
impact: Aumenta el volumen de eventos; dimensiona el registro y el SIEM.
---
id: WIN-PS-004
title: Transcripción de PowerShell
description: La transcripción de sesiones de PowerShell debe estar activada.
rationale: Guarda la entrada y salida completa de cada sesión, muy útil en el análisis forense.
category: PowerShell
severity: low
platforms: [windows]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [AU-12]
  mitre_techniques: [T1059.001]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
  name: EnableTranscripting
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Turn on PowerShell Transcription" con un directorio de salida protegido.
  breaking_risk: none
