profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AU-2, AU-12]
  mitre_mitigations: [M1047]
  mitre_techniques: [T1110, T1078]
check:
  probe: auditpol
  guid: 0CCE9215-69AE-11D9-BED3-505054503030
  op: bits_set
  expected: 3
  default: 0
remediation:
  summary: Configurar "Logon" en aciertos y errores en la directiva de auditoría avanzada.
  gpo: Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy Configuration
  commands: auditpol /set /subcategory:"{0CCE9215-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable
  breaking_risk: none
