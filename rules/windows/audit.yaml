# Directiva de auditoría avanzada y registro de eventos.
# El valor de auditpol es un campo de bits: 1 = aciertos, 2 = errores, 3 = ambos.
id: WIN-AUD-001
title: "Auditoría: Creación de procesos"
description: La subcategoría "Process Creation" debe auditar aciertos.
rationale: Registra cada proceso creado (evento 4688). Es la base de casi todas las detecciones de ataques.
category: Auditoría y registro
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AU-2, AU-12]
  mitre_mitigations: [M1047]
  mitre_techniques: [T1059, T1204]
check:
  probe: auditpol
  guid: 0CCE922B-69AE-11D9-BED3-505054503030
  op: bits_set
  expected: 1
  default: 0
remediation:
  summary: Configurar "Process Creation" en aciertos en la directiva de auditoría avanzada.
  gpo: Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy Configuration
  commands: auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable
  breaking_risk: none
---
