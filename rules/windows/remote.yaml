# Acceso remoto: RDP, Asistencia remota y WinRM.
# Cuando existe la clave de directiva (GPO) prevalece sobre la configuración local.
id: WIN-RDP-001
title: RDP exige autenticación a nivel de red (NLA)
description: Las conexiones de Escritorio remoto deben requerir NLA.
rationale: NLA autentica antes de crear la sesión, lo que reduce la exposición a vulnerabilidades previas a la autenticación (p. ej. BlueKeep) y a ataques de agotamiento.
category: Acceso remoto
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-17, IA-2]
  mitre_mitigations: [M1035]
  mitre_techniques: [T1021.001, T1210]
check:
  any:
    - {label: directiva, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services, name: UserAuthentication, op: eq, expected: 1}
    - all:
        - {label: sin directiva, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services, name: UserAuthentication, op: absent}
        - {label: local, probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp, name: UserAuthentication, op: eq, expected: 1, default: 1}
remediation:
  summary: Habilitar "Require user authentication for remote connections by using Network Level Authentication".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  breaking_risk: low
  safety: remote-access
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      name: 'UserAuthentication'
      value: 1
---
id: WIN-RDP-002
title: Asistencia remota solicitada deshabilitada
description: La Asistencia remota solicitada (fAllowToGetHelp) debe estar deshabilitada.
rationale: Es un canal de control remoto adicional usado en fraudes de soporte técnico.
category: Acceso remoto
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-17, CM-7]
  mitre_mitigations: [M1042]
  mitre_techniques: [T1219]
check:
  any:
    - {label: directiva, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services, name: fAllowToGetHelp, op: eq, expected: 0}
    - all:
        - {label: sin directiva, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services, name: fAllowToGetHelp, op: absent}
        - {label: local, probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Control\Remote Assistance, name: fAllowToGetHelp, op: eq, expected: 0, default: 1}
remediation:
  summary: Deshabilitar "Configure Solicited Remote Assistance".
  gpo: Computer Configuration > Administrative Templates > System > Remote Assistance > Configure Solicited Remote Assistance
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      name: 'fAllowToGetHelp'
      value: 0
---
id: WIN-WRM-001
title: WinRM sin autenticación Basic ni tráfico sin cifrar
description: El servicio WinRM no debe permitir autenticación Basic ni tráfico sin cifrar.
rationale: Basic envía las credenciales reutilizables en cada petición y sin cifrado pueden capturarse.
category: Acceso remoto
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-17(2), SC-8]
  mitre_techniques: [T1021.006, T1040]
check:
  all:
    - {label: AllowBasic, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service, name: AllowBasic, op: eq, expected: 0, default: 0}
    - {label: AllowUnencryptedTraffic, probe: registry, path: HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service, name: AllowUnencryptedTraffic, op: eq, expected: 0, default: 0}
remediation:
  summary: Deshabilitar "Allow Basic authentication" y "Allow unencrypted traffic" en el servicio WinRM.
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      name: 'AllowBasic'
      value: 0
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      name: 'AllowUnencryptedTraffic'
      value: 0
---
id: WIN-RDP-003
title: El cliente RDP no guarda contraseñas
description: El cliente de Escritorio remoto no debe permitir guardar contraseñas.
rationale: Las credenciales guardadas para RDP se pueden extraer del Administrador de credenciales y reutilizar para moverse a otros equipos.
category: Acceso remoto
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [IA-5]
  mitre_mitigations: [M1027]
  mitre_techniques: [T1555.004]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
  name: DisablePasswordSaving
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Do not allow passwords to be saved".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Connection Client > Do not allow passwords to be saved
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      name: 'DisablePasswordSaving'
      value: 1
impact: Hay que escribir la contraseña en cada conexión de Escritorio remoto.
---
id: WIN-RDP-004
title: El servidor RDP pide siempre la contraseña
description: El servidor de Escritorio remoto debe pedir la contraseña al conectar, aunque el cliente la tenga guardada.
rationale: Evita que un cliente con credenciales guardadas, o un atacante que lo controla, abra sesiones sin conocer la contraseña.
category: Acceso remoto
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [IA-2, AC-17]
  mitre_techniques: [T1021.001]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
  name: fPromptForPassword
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Always prompt for password upon connection".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security > Always prompt for password upon connection
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      name: 'fPromptForPassword'
      value: 1
---
id: WIN-RDP-005
title: RDP exige comunicación RPC segura
description: El servidor de Escritorio remoto solo debe aceptar llamadas RPC cifradas.
rationale: Sin RPC seguro, la gestión de sesiones remotas puede viajar sin cifrar ni autenticar.
category: Acceso remoto
severity: low
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SC-8]
  mitre_techniques: [T1021.001]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
  name: fEncryptRPCTraffic
  op: eq
  expected: 1
  default: 0
remediation:
  summary: Habilitar "Require secure RPC communication".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security > Require secure RPC communication
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      name: 'fEncryptRPCTraffic'
      value: 1
---
id: WIN-RDP-006
title: Cifrado alto en las conexiones RDP
description: El nivel de cifrado de las conexiones de Escritorio remoto debe ser Alto.
rationale: Con la capa de seguridad RDP clásica, los niveles bajos permiten cifrados débiles que un intermediario puede romper.
category: Acceso remoto
severity: low
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SC-8, SC-13]
  mitre_techniques: [T1021.001, T1557]
check:
  probe: registry
  path: HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
  name: MinEncryptionLevel
  op: eq
  expected: 3
remediation:
  summary: Fijar "Set client connection encryption level" en "High Level".
  gpo: Computer Configuration > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security > Set client connection encryption level
  breaking_risk: low
  safety: remote-access
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      name: 'MinEncryptionLevel'
      value: 3
impact: Clientes RDP muy antiguos sin cifrado de 128 bits no podrán conectar.
