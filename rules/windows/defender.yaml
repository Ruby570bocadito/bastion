id: WIN-DEF-012
title: Protección de red activada
description: Network Protection debe estar en modo Bloquear (1).
rationale: Bloquea conexiones a dominios e IPs maliciosas desde cualquier proceso, no solo el navegador.
category: Defender
severity: medium
platforms: [windows]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [SC-7, SI-3]
  mitre_mitigations: [M1031]
  mitre_techniques: [T1071, T1566.002]
check:
  probe: ps
  query: defender_prefs
  field: EnableNetworkProtection
  op: eq
  expected: 1
remediation:
  summary: Activar Network Protection.
  commands: Set-MpPreference -EnableNetworkProtection Enabled
  breaking_risk: low
  actions:
    - type: defender.pref
      name: EnableNetworkProtection
      value: 1
