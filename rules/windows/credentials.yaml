id: WIN-CRED-007
title: Limitar credenciales de dominio en caché
description: CachedLogonsCount debe ser 4 o menos.
rationale: Las credenciales en caché (DCC2) pueden extraerse y crackearse fuera de línea.
category: Credenciales
severity: medium
platforms: [windows-client, windows-member]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [IA-5(13)]
  mitre_techniques: [T1003.005]
check:
  probe: registry
  path: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
  name: CachedLogonsCount
  op: lte
  expected: 4
  default: 10
remediation:
  summary: Fijar "Interactive logon - Number of previous logons to cache" en 4 (o 0 en servidores).
  breaking_risk: medium
  actions:
    - type: registry.set
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      name: 'CachedLogonsCount'
      value: '4'
      value_type: SZ
impact: Los portátiles fuera de la red corporativa solo podrán iniciar sesión con los últimos usuarios en caché.
