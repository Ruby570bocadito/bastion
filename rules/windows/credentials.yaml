# Protección de credenciales y autenticación NTLM/LM.
id: WIN-CRED-001
title: WDigest no guarda contraseñas en memoria
description: UseLogonCredential de WDigest debe ser 0.
rationale: Con WDigest activo, LSASS guarda las contraseñas en texto claro y herramientas como Mimikatz las extraen directamente.
category: Credenciales
severity: critical
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [IA-5, SC-28]
  mitre_mitigations: [M1043]
  mitre_techniques: [T1003.001]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
  name: UseLogonCredential
  op: eq
  expected: 0
  default: 0
remediation:
  summary: Fijar UseLogonCredential = 0 (o eliminar el valor).
  commands: reg add "HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" /v UseLogonCredential /t REG_DWORD /d 0 /f
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      name: 'UseLogonCredential'
      value: 0
---
id: WIN-CRED-002
title: LSASS protegido (RunAsPPL)
description: La protección LSA (proceso protegido) debe estar activada.
rationale: Impide que procesos no protegidos, incluso con privilegios de administrador, lean la memoria de LSASS para robar credenciales.
category: Credenciales
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [SC-39, IA-5]
  mitre_mitigations: [M1025, M1043]
  mitre_techniques: [T1003.001]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\Lsa
  name: RunAsPPL
  op: in
  expected: [1, 2]
  default: 0
remediation:
  summary: Activar RunAsPPL y reiniciar. Comprueba antes en modo auditoría los complementos de LSA de terceros.
  gpo: Computer Configuration > Administrative Templates > System > Local Security Authority > Configure LSASS to run as a protected process
  commands: reg add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v RunAsPPL /t REG_DWORD /d 1 /f
  breaking_risk: medium
  reboot_required: true
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
      name: 'RunAsPPL'
      value: 1
impact: Complementos de LSA o controladores de terceros no firmados (algunos SSO, lectores de tarjetas) pueden dejar de cargarse.
