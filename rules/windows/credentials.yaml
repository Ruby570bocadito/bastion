id: WIN-CRED-003
title: Solo NTLMv2 (rechazar LM y NTLMv1)
description: El nivel de autenticación de LAN Manager debe ser 5 (enviar solo NTLMv2, rechazar LM y NTLM).
rationale: NTLMv1 y LM se crackean o retransmiten trivialmente.
category: Credenciales
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [IA-2, SC-8]
  mitre_mitigations: [M1041]
  mitre_techniques: [T1557.001, T1110.002]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\Lsa
  name: LmCompatibilityLevel
  op: eq
  expected: 5
  default: 3
remediation:
  summary: Fijar "Network security - LAN Manager authentication level" en "Send NTLMv2 response only. Refuse LM & NTLM".
  gpo: Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options > Network security > LAN Manager authentication level
  breaking_risk: medium
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
      name: 'LmCompatibilityLevel'
      value: 5
impact: Dispositivos o aplicaciones muy antiguos que solo hablen NTLMv1 dejarán de autenticarse. Audita antes con los eventos NTLM.
---
id: WIN-CRED-004
title: No almacenar hashes LM
description: NoLMHash debe ser 1.
rationale: El hash LM se crackea en segundos.
category: Credenciales
severity: high
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [IA-5]
  mitre_techniques: [T1110.002]
check:
  probe: registry
  path: HKLM\SYSTEM\CurrentControlSet\Control\Lsa
  name: NoLMHash
  op: eq
  expected: 1
  default: 1
remediation:
  summary: Habilitar "Network security - Do not store LAN Manager hash value on next password change".
  breaking_risk: none
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
      name: 'NoLMHash'
      value: 1
---
id: WIN-CRED-005
title: Sin enumeración anónima de cuentas y recursos
description: RestrictAnonymousSAM y RestrictAnonymous deben ser 1.
rationale: Impide que un atacante sin credenciales enumere usuarios y recursos compartidos.
category: Credenciales
severity: medium
platforms: [windows]
profiles: [win-workstation-l1, win-server-l1]
references:
  nist: [AC-14]
  mitre_techniques: [T1087.001, T1135]
check:
  all:
    - {label: RestrictAnonymousSAM, probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Control\Lsa, name: RestrictAnonymousSAM, op: eq, expected: 1, default: 1}
    - {label: RestrictAnonymous, probe: registry, path: HKLM\SYSTEM\CurrentControlSet\Control\Lsa, name: RestrictAnonymous, op: eq, expected: 1, default: 0}
remediation:
  summary: Habilitar "Network access - Do not allow anonymous enumeration of SAM accounts (and shares)".
  breaking_risk: low
  actions:
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
      name: 'RestrictAnonymousSAM'
      value: 1
    - type: registry.set
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
      name: 'RestrictAnonymous'
      value: 1
---
id: WIN-CRED-006
title: Credential Guard en ejecución
description: Windows Defender Credential Guard debe estar en ejecución.
rationale: Aísla los secretos de LSASS mediante virtualización; ni con privilegios de SYSTEM se pueden extraer hashes NTLM ni tickets Kerberos.
category: Credenciales
severity: high
platforms: [windows]
profiles: [win-workstation-l2, win-server-l2]
references:
  nist: [SC-39]
  mitre_mitigations: [M1043]
  mitre_techniques: [T1003.001, T1550.002]
check:
  probe: ps
  query: device_guard
  field: SecurityServicesRunning
  op: contains
  expected: 1
remediation:
  summary: Habilitar VBS y Credential Guard (UEFI con bloqueo) por GPO o Intune.
  gpo: Computer Configuration > Administrative Templates > System > Device Guard > Turn On Virtualization Based Security
  breaking_risk: medium
  reboot_required: true
impact: Requiere hardware compatible (virtualización, Secure Boot, TPM). Rompe NTLMv1, MS-CHAPv2 y la delegación Kerberos sin restricciones.
